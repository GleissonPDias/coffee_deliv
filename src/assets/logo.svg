<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="Coffee Delivery">
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#c47f17"/>
    </linearGradient>
  </defs>
  <!-- coffee cup -->
  <g transform="translate(8,8)">
    <rect x="4" y="10" width="34" height="28" rx="6" fill="url(#cup)" />
    <rect x="4" y="10" width="34" height="6" rx="3" fill="#a86a12" opacity="0.35"/>
    <path d="M38 16 Q46 16 46 24 Q46 32 38 32" fill="none" stroke="#4b2995" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 6 Q14 2 16 6" fill="none" stroke="#4b2995" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 6 Q22 2 24 6" fill="none" stroke="#4b2995" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 6 Q30 2 32 6" fill="none" stroke="#4b2995" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- brand name -->
  <text x="62" y="26" font-family="Baloo 2, cursive" font-size="20" font-weight="700" fill="#c47f17">Coffee</text>
  <text x="62" y="46" font-family="Roboto, sans-serif" font-size="13" font-weight="500" fill="#4b2995" letter-spacing="1.5">DELIVERY</text>
</svg>